[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxor"
version = "0.1.0"
description = "Motor de automações declarativas: você descreve o fluxo em YAML, o Fluxor executa, observa e reporta."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "NeithanDev", email = "neithandev@outlook.com" }]
keywords = ["automation", "workflow", "orchestration", "yaml", "scheduler", "etl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "APScheduler>=3.10,<4",
    "SQLAlchemy>=2.0.30",
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    # O Windows não tem base de fusos horários do sistema; sem isto o
    # zoneinfo/APScheduler falha ao resolver "America/Sao_Paulo".
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/seu-usuario/fluxor"
Documentation = "https://github.com/seu-usuario/fluxor/blob/main/GUIA.md"
Issues = "https://github.com/seu-usuario/fluxor/issues"

[project.scripts]
fluxor = "fluxor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxor"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC",
]
ignore = [
    "B008",  # chamada em default de argumento (padrão do FastAPI/Typer)
    "N818",  # nomes de exceção sem sufixo Error
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# ---------------------------------------------------------------------------
# Mypy — checagem estática de tipos
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/fluxor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
