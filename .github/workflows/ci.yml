name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  qualidade:
    name: Testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Formatação (ruff format)
        run: ruff format --check src tests

      - name: Tipos (mypy)
        run: mypy

      - name: Testes
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Validar os workflows de exemplo
        run: fluxor validate examples/*.yaml

      - name: Executar o exemplo offline de ponta a ponta
        run: fluxor run examples/hello-mundo.yaml

      - name: Enviar cobertura
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t fluxor:ci .

      - name: Subir e checar o /health
        run: |
          docker run -d --name fluxor-ci -p 8000:8000 fluxor:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo "\nOK: container respondendo"
              exit 0
            fi
            sleep 2
          done
          echo "container não respondeu a tempo"
          docker logs fluxor-ci
          exit 1
